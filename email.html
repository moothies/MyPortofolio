<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kirim Email — Bowo Lubis</title>

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#5f11e66e;
      --glass: rgba(255,255,255,0.04);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                   "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box}

    
    body{
      margin:0;
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 200px;
      position:relative;
      overflow:hidden;
    }

    /* ===== BACKGROUND VIDEO ===== */
    .bg-video{
      position:fixed;
      inset:0;
      z-index:-3;
      overflow:hidden;
    }
    .bg-video video{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* overlay gelap */
    .bg-overlay{
      position:fixed;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(5,8,20,.75),
        rgba(5,8,20,.9)
      );
      z-index:-2;
    }

    /* efek glow */
    .bg-glow{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at top, rgba(124,58,237,.25), transparent 45%),
        radial-gradient(circle at bottom, rgba(79,70,229,.2), transparent 50%);
      z-index:-1;
      pointer-events:none;
    }
    .card{
      width:100%;
      max-width:520px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03),
                                           rgba(255,255,255,0.01));
      border-radius:18px;
      padding:26px;
      box-shadow:0 10px 30px rgba(2,6,23,.7);
    }

    h1{
      margin:0 0 6px;
      font-size:24px;
    }

    p{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
    }

    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input, textarea{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(32, 19, 19, 0.08);
      background:rgba(255,255,255,0.03);
      color:white;
      margin-bottom:14px;
      font-family:inherit;
    }

    textarea{
      resize:vertical;
      min-height:120px;
    }

    input:focus, textarea:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 2px rgba(124,58,237,.25);
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:6px;
    }

    .btn{
      flex:1;
      padding:12px;
      border-radius:12px;
      background:var(--accent);
      border:none;
      color:white;
      font-weight:600;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
    }

    .btn.secondary{
      background:transparent;
      border:1px solid rgba(255,255,255,0.08);
      color:var(--muted);
    }
    @keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  </style>
</head>

<body>

<!-- 🔐 PROTEKSI LOGIN -->
<script>
  if (localStorage.getItem("isLogin") !== "true") {
    window.location.href = "login.html";
  }
</script>
<div class="bg-video">
  <video autoplay muted loop playsinline>
    <source src="bhcc.mp4" type="video/mp4">
  </video>
</div>
<div class="bg-overlay"></div>
<div class="bg-glow"></div>
  <div class="card">
    <h1>Kirim Email </h1>
    <p>Gunakan form ini untuk menghubungi saya secara langsung.</p>

    <form action="mailto:bowoh457@gmail.com" method="POST" enctype="text/plain">
      <label>Nama</label>
      <input type="text" name="Nama" required>

      <label>Email</label>
      <input type="email" name="Email" required>

      <label>Pesan</label>
      <textarea name="Pesan" required></textarea>

      <div class="actions">
        <button type="submit" class="btn">Kirim Email</button>
        <a href="index.html" class="btn secondary">Kembali</a>
      </div>
    </form>
  </div>

</body>
</html>
