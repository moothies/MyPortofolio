<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — Bowo Lubis</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#6d28d9;
  --accent-soft:rgba(109,40,217,.25);
  --text:#f1f5f9;
  --muted:#9aa4b2;
  --card:rgba(255,255,255,.05);
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(5,8,20,.8), rgba(5,8,20,.95)),
    url("bg.jpg") center/cover fixed;
  color:var(--text);
  font-family:Inter, system-ui, sans-serif;
  overflow:hidden;
}

/* soft ambient light */
body::before{
  content:"";
  position:fixed;
  inset:-30%;
  background:
    radial-gradient(circle at top, var(--accent-soft), transparent 50%),
    radial-gradient(circle at bottom right, rgba(56,189,248,.15), transparent 55%);
  z-index:-1;
}

/* card */
.card{
  width:100%;
  max-width:460px;
  padding:48px 42px;
  border-radius:26px;
  background:var(--card);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  text-align:center;
  animation:enter 1s ease forwards;
}

@keyframes enter{
  from{opacity:0; transform:translateY(28px)}
  to{opacity:1; transform:none}
}

/* logo */
.logo{
  width:72px;
  height:72px;
  margin:0 auto 24px;
  border-radius:22px;
  overflow:hidden;
  background:linear-gradient(135deg,var(--accent),#312e81);
  box-shadow:0 0 40px var(--accent-soft);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}


/* typography */
h1{
  margin:0;
  font-family:"Playfair Display", serif;
  font-size:28px;
  font-weight:600;
  letter-spacing:.3px;
}

p{
  margin:16px 0 36px;
  font-size:15.5px;
  color:var(--muted);
  line-height:1.7;
}

/* button */
.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-size:15.5px;
  font-weight:600;
  letter-spacing:.3px;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#4338ca);
  box-shadow:0 18px 45px rgba(109,40,217,.45);
  transition:.35s ease;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 28px 65px rgba(109,40,217,.6);
}

.btn:active{
  transform:scale(.97);
}

/* footer */
footer{
  margin-top:32px;
  font-size:12px;
  color:var(--muted);
  opacity:.75;
  letter-spacing:.3px;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">
  <img src="berrr.jpeg" alt="Bowo Lubis">
</div>


  <h1>WELCOME TO MY PORTFOLIO</h1>
  <p>
Saya membantu brand, UMKM, dan personal brand membangun kehadiran digital melalui strategi konten, visual kreatif, dan storytelling yang tepat sasaran
  </p>

  <button class="btn" id="enterBtn">
    Masuk ke Portfolio
  </button>

  <footer>© 2025 Bowo Lubis</footer>
</div>

<script>
  if(localStorage.getItem("isLogin")==="true"){
    window.location.href="index.html";
  }

  document.getElementById("enterBtn").onclick=()=>{
    localStorage.setItem("isLogin","true");
    window.location.href="index.html";
  };
</script>

</body>
</html>
